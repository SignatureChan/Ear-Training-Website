<!DOCTYPE html>
<html>
<head>
    <title>Ear Training</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="home-screen">
        <h1>Ear Training</h1>

        <button id="interval-button">Interval Training</button>
        <button id="pitch-button">Pitch Practice</button>
    </div>

    <div id="interval-screen">
        <h1>Interval Training</h1>

        <button id="listen-button">Listen</button>
        <p>What interval did you hear??</p>

        <div id="answer-buttons">
            <button>Unison</button>
            <button>Minor Second</button>
            <button>Major Second</button>
            <button>Minor Third</button>
            <button>Major Third</button>
            <button>Perfect Fourth</button>
            <button>Tritone</button>
            <button>Perfect Fifth</button>
            <button>Minor Sixth</button>
            <button>Major Sixth</button>
            <button>Minor Seventh</button>
            <button>Major Seventh</button>
            <button>Octave</button>
        </div>

        <p id="feedback"></p>

        <p id="revealed-pitches"></p>

        <button id="interval-next-question-button">Next Question</button>

        <p id="correctAnswerCount">You have gotten 0 correct</p>
        <p id="incorrectAnswerCount"></p>
    </div> 

    <div id="pitch-screen">
        <h1>Pitch Identification</h1>

        <button id="pitch-listen-button">Listen</button>

        <p>What pitch did you hear?</p>

        <div id="pitch-answer-buttons">
            <button data-note="A">A</button>
            <button data-note="A#">A#/Bb</button>
            <button data-note="B">B</button>
            <button data-note="C">C</button>
            <button data-note="C#">C#/Db</button>
            <button data-note="D">D</button>
            <button data-note="D#">D#/Eb</button>
            <button data-note="E">E</button>
            <button data-note="F">F</button>
            <button data-note="F#">F#/Gb</button>
            <button data-note="G">G</button>
            <button data-note="G#">G#/Ab</button>
        </div>

        <p id="pitch-feedback"></p>
        <p id="pitch-revealed"></p>
        <p id="pitch-correct-count">You have gotten 0 correct.</p>
        <p id="pitch-incorrect-count">You have gotten 0 incorrect.</p>

        <button id="pitch-next-question-button">Next Question</button>
        <button id="pitch-home-button">Home</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
