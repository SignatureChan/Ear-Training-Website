<!DOCTYPE html>
<html>
<head>
    <title>Ear Training</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="home-screen">
        <h1>Ear Training</h1>

        <button id="interval-button">Interval Training</button>
        <button id="pitch-button">Pitch Practice</button>
    </div>

    <div id="interval-screen">
        <h1>Interval Training</h1>

        <button id="listen-button">Listen</button>
        <p>What interval did you hear??</p>

        <div id="answer-buttons">
            <button>Major 2nd</button>
            <button>Minor 2nd</button>
            <button>Major 3rd</button>
            <button>Minor 3rd</button>
            <button>Perfect 4th</button>
            <button>Perfect 5th</button>
            <button>Minor 6th</button>
            <button>Major 6th</button>
            <button>Minor 7th</button>
            <button>Major 7th</button>
            <button>Octave</button>
        </div>

        <p id="feedback"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
